<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
body{font-family:Arial;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#222;padding:30px;border-radius:12px;width:300px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
button{width:100%;padding:12px;background:#e91e63;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
a{color:#e91e63;text-decoration:none}
.err{color:#ff5555;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>Login</h2>
{% if error %}<p class="err">{{error}}</p>{% endif %}
<form method="POST">
<input name="name" placeholder="Your name" required>
<input name="password" type="password" placeholder="Password" required>
<button>Login</button>
</form>
<p>No account? <a href="/signup">Sign up</a></p>
</div>
</body>
</html>
