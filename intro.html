<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
body{margin:0;background:#000;overflow:hidden;height:100vh}
video{width:100vw;height:100vh;object-fit:cover}
.skip{position:fixed;top:20px;right:20px;background:rgba(255,255,255,0.2);color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<video id="intro" autoplay>
  <source src="/static/intro.mp4" type="video/mp4">
</video>
<button class="skip" onclick="location.href='/skip_intro'">Skip →</button>
<script>
document.getElementById('intro').addEventListener('ended', () => {
  location.href = '/skip_intro';
});
</script>
</body>
</html>
