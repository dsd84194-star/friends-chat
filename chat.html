<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends Chat</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#111;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
.top{background:#222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.top b{color:#e91e63}
.msgs{flex:1;overflow-y:auto;padding:12px}
.msg{background:#222;padding:10px 14px;border-radius:12px;margin:8px 0;max-width:80%;word-wrap:break-word}
.msg.mine{background:#e91e63;margin-left:auto}
.msg .name{font-size:12px;color:#aaa;margin-bottom:4px}
.msg.mine .name{color:#ffd0e0}
.msg .time{font-size:10px;color:#888;margin-top:4px;text-align:right}
.yt{width:100%;aspect-ratio:16/9;border-radius:8px;margin-top:6px;border:none}
.del{background:transparent;border:none;color:#ff8888;font-size:12px;cursor:pointer;float:right}
.input-bar{display:flex;padding:10px;background:#222;gap:8px}
.input-bar input{flex:1;padding:12px;border-radius:20px;border:none;background:#333;color:#fff}
.input-bar button{background:#e91e63;color:#fff;border:none;padding:0 20px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <div>👥 <b>Friends Chat</b></div>
  <div>
    <span>{{user.name}}{% if user.is_admin %} 👑{% endif %}</span>
    <a href="/logout" style="color:#e91e63;margin-left:10px">Logout</a>
  </div>
</div>
<div class="msgs" id="msgs"></div>
<div class="input-bar">
  <input id="text" placeholder="Message or YouTube link..." autocomplete="off">
  <button onclick="send()">Send</button>
</div>
<script>
const myName = "{{user.name}}";
const isAdmin = {{ 'true' if user.is_admin else 'false' }};
let lastMsgId = 0;

async function load(firstLoad = false) {
  const r = await fetch('/api/messages');
  const msgs = await r.json();

  // If nothing new, do nothing (no rebuild = no blinking)
  const newestId = msgs.length ? msgs[msgs.length - 1].id : 0;
  if (!firstLoad && newestId === lastMsgId) return;
  lastMsgId = newestId;

  const box = document.getElementById('msgs');
  const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;

  box.innerHTML = '';
  msgs.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg' + (m.name === myName ? ' mine' : '');
    let inner = `<div class="name">${m.name}${m.is_admin?' 👑':''}</div>`;
    if (m.youtube_id) {
      inner += `<div>${m.text}</div>`;
      inner += `<iframe class="yt" src="https://www.youtube.com/embed/${m.youtube_id}" allowfullscreen></iframe>`;
    } else {
      inner += `<div>${m.text}</div>`;
    }
    inner += `<div class="time">${m.time}`;
    if (isAdmin) inner += ` <button class="del" onclick="del(${m.id})">delete</button>`;
    inner += `</div>`;
    d.innerHTML = inner;
    box.appendChild(d);
  });

  // Only auto-scroll if user was already at the bottom
  if (wasAtBottom || firstLoad) box.scrollTop = box.scrollHeight;
}

async function send() {
  const input = document.getElementById('text');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await fetch('/api/send', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text})
  });
  // Force immediate reload after sending
  lastMsgId = 0;
  load();
}

async function del(id) {
  if (!confirm('Delete this message?')) return;
  await fetch('/api/delete/' + id, {method:'DELETE'});
  lastMsgId = 0;
  load();
}

document.getElementById('text').addEventListener('keypress', e => {
  if (e.key === 'Enter') send();
});

// Initial load
load(true);

// Poll every 2 sec, but only rebuild if new message exists
setInterval(load, 2000);
</script>
</body>
</html>
